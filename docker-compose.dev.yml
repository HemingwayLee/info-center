services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      WATCHFILES_FORCE_POLLING: "true"
      # Set one of these in .env: an OAuth token uses your Claude Pro/Max plan, an API key bills the API.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_WORKSPACE: /workspace
      # Keep Claude Code's session transcripts so conversations can resume after restarts.
      CLAUDE_CONFIG_DIR: /claude-config
    ports:
      - "8765:8765"
    volumes:
      - ./backend:/app
      # The directory Claude Code works in (reads, writes, runs commands).
      - ./workspace:/workspace
      - claude-config:/claude-config
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      API_PROXY_TARGET: http://backend:8765
      VITE_USE_POLLING: "true"
    ports:
      - "5678:5678"
    volumes:
      - ./frontend:/app
      # Keep the container's node_modules instead of the (possibly empty) host one.
      - /app/node_modules
    depends_on:
      - backend

  # Database browser (tables, rows, SQL). Connects to the app database by default; use the
  # UI's connection screen for other databases. Reached through pgweb-proxy below.
  pgweb:
    image: sosedoff/pgweb:0.17.0
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  # Serves pgweb at localhost:8081 with our additions (tools/pgweb/custom, e.g. JSON pretty-printing).
  # Bound to localhost because pgweb has no login.
  pgweb-proxy:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./tools/pgweb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tools/pgweb/custom:/usr/share/nginx/pgweb-custom:ro
    depends_on:
      - pgweb

volumes:
  pgdata:
  claude-config:
