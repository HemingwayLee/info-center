# Sits in front of pgweb: forwards everything to it and adds our scripts (./custom) to its page.
server {
    listen 8081;

    location / {
        proxy_pass http://pgweb:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # sub_filter can't edit compressed responses.
        proxy_set_header Accept-Encoding "";
        # Match pgweb's own query timeout (300 s).
        proxy_read_timeout 300s;

        sub_filter '</body>' '<script src="/custom/json-viewer.js"></script></body>';
        sub_filter_once on;
    }

    location /custom/ {
        alias /usr/share/nginx/pgweb-custom/;
        # Edits show up on reload.
        add_header Cache-Control "no-store";
    }
}
